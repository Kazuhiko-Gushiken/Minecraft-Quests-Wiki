<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./quests.css?v=0.5.1">
    </head>
    <body>
        <div id="sidebar">
            <div id="sidebarButtons">
                <h2>Mod Chapters</h2>
            </div>

            <div id="sidebarFooter">
                <div>Ctrl+Click a chapter for credits.</div>

                <label>
                    <input type="checkbox" id="gridToggle" checked>
                    Render grid
                </label>

            </div>
        </div>

        <canvas id="out"></canvas>

        <div id="questOverlay" class="hidden">
            <div id="questCard">
                <div id="questHeaderWrapper">
                    <div id="questHeader">
                        <button id="copyQuestLink" title="Copy Link"></button>
                        <canvas id="questIcon" width="96" height="96"></canvas>
                        <h1 id="questTitle"></h1>
                        <h2 id="questSubtitle"></h2>
                    </div>
                </div>
                <hr>
                
                <div id="questDescriptionWrapper">
                        <div id="questDescription"></div>
                </div>
            </div>
        </div>

        <script type="module" src="./quests.js?v=0.5.1"></script>
    </body>
</html>
